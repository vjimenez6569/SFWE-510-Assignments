input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  if [service] == "organization-service" {
    mutate {
      add_tag => [ "organization-service" ]
    }
  }
  else if [service] == "licensing-service" {
    mutate {
      add_tag => [ "license-service" ]
    }
  }
  else if [service] == "gateway-server" {
    mutate {
      add_tag => [ "gateway-service" ]
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
  }
}